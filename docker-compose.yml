services:
  protocolos-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHATWOOT_INTERNAL_URL: ${CHATWOOT_INTERNAL_URL:-http://rails:3000}
      UPLOAD_DIR: /data/uploads
      API_SCRIPT_NAME: /chamados-api
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes:
      - protocolos_uploads:/data/uploads
    restart: unless-stopped
    networks:
      - chatwoot
      - protocolos

  protocolos-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    volumes:
      - ./apps/inject/inject.js:/usr/share/nginx/html/inject.js:ro
    restart: unless-stopped
    networks:
      - protocolos

  protocolos-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - protocolos-api
      - protocolos-web
    ports:
      - "${PROTOCOLOS_PROXY_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx/front.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts: []
    restart: unless-stopped
    networks:
      - chatwoot
      - protocolos

volumes:
  protocolos_uploads:

networks:
  protocolos:
  chatwoot:
    external: true
    name: ${CHATWOOT_NETWORK:-chatwoot_default}
