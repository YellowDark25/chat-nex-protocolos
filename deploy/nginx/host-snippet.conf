# Cole no Nginx que hoje aponta para o Chatwoot, OU troque o upstream
# do Chatwoot para o protocolos-proxy:8088 (recomendado: o proxy já injeta o script).

# Opção A — o host fala com o protocolos-proxy (imagem oficial intacta):
#   proxy_pass http://127.0.0.1:8088;

# Opção B — o host continua no rails e só acrescenta as rotas do plugin:
# location /chamados-api/ { proxy_pass http://127.0.0.1:8088; }
# location /chamados/ { proxy_pass http://127.0.0.1:8088; }
