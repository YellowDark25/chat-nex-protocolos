upstream chatwoot-upstream {
  server rails:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /chamados-api/ {
    set $nex_api protocolos-api;
    proxy_pass http://$nex_api:4567;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header access-token $http_access_token;
    proxy_set_header client $http_client;
    proxy_set_header uid $http_uid;
    proxy_set_header expiry $http_expiry;
    proxy_set_header token-type $http_token_type;
    proxy_set_header X-Account-Id $http_x_account_id;
  }

  location /protocolos-api/ {
    rewrite ^/protocolos-api/protocolos(.*)$ /chamados-api/chamados$1 last;
    rewrite ^/protocolos-api/(.*)$ /chamados-api/$1 last;
  }

  location /chamados/ {
    set $nex_web protocolos-web;
    rewrite ^/chamados/(.*)$ /$1 break;
    proxy_pass http://$nex_web:80;
    proxy_set_header Host $host;
  }

  location = /protocolos {
    return 301 /chamados/;
  }

  location /protocolos/ {
    rewrite ^/protocolos/(.*)$ /chamados/$1 permanent;
  }

  # Vite no Docker: nao passar pelo Rails. Depois do reboot o cold start
  # (centenas de i18n) estoura o timeout padrao de 60s e o front fica em branco.
  location /vite-dev/ {
    set $vite_dev vite;
    proxy_pass http://$vite_dev:3036;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    proxy_pass http://chatwoot-upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Content-Encoding;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    sub_filter_types text/html;
    sub_filter '</body>' '<script src="/chamados/inject.js?v=20260818g"></script></body>';
    sub_filter_once on;
  }
}
